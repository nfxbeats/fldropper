[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fldropper"
dynamic = ["version"]
description = "Copy FL Studio content into configured destinations"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "PyFLP==2.2.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fldropper = "fldropper.ui:main"

[tool.setuptools.packages.find]
include = ["fldropper*"]

[tool.setuptools.dynamic]
version = {attr = "fldropper.__version__"}

[tool.setuptools.package-data]
fldropper = ["assets/*.ico", "assets/*.png", "defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
