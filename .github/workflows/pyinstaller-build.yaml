name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            architecture: x64
          - name: macOS-Apple-Silicon
            os: macos-15
            architecture: arm64
          - name: macOS-Intel
            os: macos-15-intel
            architecture: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install application and build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install . 'PyInstaller==6.22.3' 'Pillow>=10,<13'
      - name: Build, check bundled app, and create archive
        run: python .github/packaging/build.py
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: FLDropper-${{ matrix.name }}
          path: .github/packaging/dist/FLDropper-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            .github/packaging/build/**/*.txt
            .github/packaging/build/**/*.html
          if-no-files-found: ignore
